services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 3001
      DATABASE_PATH: /app/data/pastebin.db
      CORS_ORIGIN: http://localhost:8080
      RATE_LIMIT_MAX: 300
      BODY_LIMIT: 150kb
    ports:
      - "3001:3001"
    volumes:
      - paste_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  paste_data:
